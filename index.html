<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>マナビバ 入退室打刻</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      width: 100vw;
      height: 100vh;
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Kaku Gothic ProN", sans-serif;
      background-color: #000;
      user-select: none;
    }

    /* 全体コンテナ（画面いっぱいに広げて相対配置） */
    #app-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      transition: background-color 0.15s ease;
    }

    /* カメラ枠：画面全体にフィット */
    #reader-wrapper {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
    }
    #reader {
      width: 100% !important;
      height: 100% !important;
      border: none !important;
      background: #000;
    }
    #reader video {
      width: 100% !important;
      height: 100% !important;
      object-fit: cover !important;
    }

    /* 上部タイトル（カメラの上に浮かす） */
    h1 {
      position: absolute;
      top: 2vh;
      left: 0;
      width: 100%;
      z-index: 10;
      color: #ffffff;
      margin: 0;
      text-align: center;
      font-size: 4.5vh;
      font-weight: 900;
      letter-spacing: 2px;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.8), 0 0 20px rgba(0, 0, 0, 0.5);
      pointer-events: none;
    }

    /* 下部ステータス表示エリア（カメラの上に浮かす） */
    #status-container {
      position: absolute;
      bottom: 3vh;
      left: 0;
      width: 100%;
      z-index: 10;
      text-align: center;
      padding: 0 2vw;
      pointer-events: none;
    }
    #status-text {
      font-size: 6.5vh;
      font-weight: 900;
      color: #00ffffff;
      line-height: 1.1;
      word-break: break-all;
      text-shadow: 0 2px 12px rgba(0, 0, 0, 0.9), 0 0 20px rgba(0, 0, 0, 0.6);
    }
    .tap-hint {
      font-size: 2.2vh;
      color: #e0e0e0;
      margin-top: 0.8vh;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.9);
    }

    /* 認証成功時の全画面緑色スタイル */
    #app-container.success {
      background-color: #28a745 !important;
    }
    #app-container.success h1,
    #app-container.success .tap-hint,
    #app-container.success #reader-wrapper {
      display: none;
    }
    #app-container.success #status-container {
      position: static;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100%;
      width: 100%;
    }
    #app-container.success #status-text {
      color: #ffffff !important;
      font-size: 35vh !important;
      font-weight: 900 !important;
      letter-spacing: 4px;
      text-shadow: 0 8px 24px rgba(0,0,0,0.3);
    }
  </style>
</head>
<body>

  <div id="app-container">
    <h1>学習塾マナビバ 入退室管理</h1>
    
    <div id="reader-wrapper">
      <div id="reader"></div>
    </div>

    <div id="status-container">
      <div id="status-text">QRをかざしてください</div>
      <div class="tap-hint" id="hint-text">※画面をタップすると全画面化＆カメラを再起動します</div>
    </div>
  </div>

  <script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbxs2i-UDDR_ddUW902Z-oHHS_X133LjccSXEDzLNN143Vxi3aunK2g60VbPwNb0SzWu/exec";

    // ==========================================
    // 1. スリープ防止 (Screen Wake Lock API)
    // ==========================================
    let wakeLock = null;
    async function requestWakeLock() {
      try {
        if ('wakeLock' in navigator) {
          wakeLock = await navigator.wakeLock.request('screen');
        }
      } catch (err) {
        console.log("Wake Lock エラー:", err);
      }
    }

    document.addEventListener("visibilitychange", async () => {
      if (wakeLock !== null && document.visibilityState === 'visible') {
        await requestWakeLock();
      }
    });

    // ==========================================
    // 2. 音声再生 (Web Audio API)
    // ==========================================
    let audioCtx = null;
    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function playBeep() {
      try {
        initAudio();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(2000, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.15);
      } catch (e) {
        console.error("Audio Error:", e);
      }
    }

    // ==========================================
    // 3. 全画面表示トリガー
    // ==========================================
    function requestFullScreen() {
      const doc = document.documentElement;
      if (!document.fullscreenElement && !document.webkitFullscreenElement) {
        if (doc.requestFullscreen) {
          doc.requestFullscreen().catch(() => {});
        } else if (doc.webkitRequestFullscreen) {
          doc.webkitRequestFullscreen();
        }
      }
    }

    // ==========================================
    // 4. 爆速・全画面緑色 認証処理
    // ==========================================
    let isProcessing = false;

    function onScanSuccess(decodedText, decodedResult) {
      if (isProcessing) return;
      isProcessing = true;

      playBeep();

      const container = document.getElementById("app-container");
      const statusText = document.getElementById("status-text");
      
      container.classList.add("success");
      statusText.innerText = "OK";

      fetch(`${GAS_URL}?id=${encodeURIComponent(decodedText)}`, {
        method: "POST",
        mode: "no-cors"
      }).catch(err => console.error("送信エラー:", err));

      setTimeout(() => {
        container.classList.remove("success");
        statusText.innerText = "QRをかざしてください";
        isProcessing = false;
      }, 1500);
    }

    // ==========================================
    // 5. カメラの起動 ＆ リセット処理 (A案)
    // ==========================================
    let html5QrcodeScanner = null;

    function startScanner() {
      if (html5QrcodeScanner) {
        try {
          html5QrcodeScanner.clear();
        } catch(e) {
          console.log("Clear error:", e);
        }
      }
      
      html5QrcodeScanner = new Html5QrcodeScanner(
        "reader", 
        { 
          fps: 15, 
          qrbox: function(viewfinderWidth, viewfinderHeight) {
            const minEdge = Math.min(viewfinderWidth, viewfinderHeight);
            return { width: Math.floor(minEdge * 0.6), height: Math.floor(minEdge * 0.6) };
          }
        },
        false
      );
      html5QrcodeScanner.render(onScanSuccess);
    }

    // 初回起動
    startScanner();

    // ==========================================
    // 6. 画面タップ時の処理（全画面＋音声＋スリープ＋カメラ再起動）
    // ==========================================
    document.body.addEventListener("click", () => {
      initAudio();
      requestFullScreen();
      requestWakeLock();
      
      // 画面更新はせず、カメラの接続だけを裏で再起動
      startScanner();
    });
  </script>
</body>
</html>
