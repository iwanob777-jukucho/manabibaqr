<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>マナビバ 入退室打刻</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Kaku Gothic ProN", sans-serif;
      background-color: #f8f9fa;
      user-select: none;
    }

    /* 全体コンテナ */
    #app-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      width: 100vw;
      height: 100vh;
      padding: 1.5vh 2vw;
      transition: background-color 0.15s ease;
    }

    /* 上部タイトル */
    h1 {
      color: #333;
      margin: 0;
      font-size: 5vh;
      font-weight: 900;
      letter-spacing: 2px;
    }

    /* カメラ枠（大型化） */
    #reader-wrapper {
      width: 100%;
      max-width: 900px;
      flex-grow: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 1vh 0;
    }
    #reader {
      width: 100%;
      height: 100%;
      max-height: 68vh;
      background: #000;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(0,0,0,0.25);
    }
    #reader video {
      object-fit: cover !important;
    }

    /* 下部ステータス表示エリア */
    #status-container {
      width: 100%;
      max-width: 900px;
      text-align: center;
      padding: 0.5vh 0;
    }
    #status-text {
      font-size: 6.5vh;
      font-weight: 900;
      color: #007bff;
      line-height: 1.1;
      word-break: break-all;
    }
    .tap-hint {
      font-size: 2.5vh;
      color: #6c757d;
      margin-top: 0.5vh;
    }

    /* 認証成功時の全画面緑色スタイル */
    #app-container.success {
      background-color: #28a745 !important;
    }
    #app-container.success h1,
    #app-container.success .tap-hint,
    #app-container.success #reader-wrapper {
      display: none;
    }
    #app-container.success #status-container {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100%;
      max-width: 100%;
    }
    #app-container.success #status-text {
      color: #ffffff !important;
      font-size: 35vh !important;
      font-weight: 900 !important;
      letter-spacing: 4px;
      text-shadow: 0 8px 24px rgba(0,0,0,0.3);
    }
  </style>
</head>
<body>

  <div id="app-container">
    <h1>学習塾マナビバ 入退室管理</h1>
    
    <div id="reader-wrapper">
      <div id="reader"></div>
    </div>

    <div id="status-container">
      <div id="status-text">QRをかざしてください</div>
      <div class="tap-hint" id="hint-text">※固まった場合は画面をタップするとリロードします</div>
    </div>
  </div>

  <script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbxs2i-UDDR_ddUW902Z-oHHS_X133LjccSXEDzLNN143Vxi3aunK2g60VbPwNb0SzWu/exec";

    // ==========================================
    // 1. スリープ防止 (Screen Wake Lock API)
    // ==========================================
    let wakeLock = null;
    async function requestWakeLock() {
      try {
        if ('wakeLock' in navigator) {
          wakeLock = await navigator.wakeLock.request('screen');
        }
      } catch (err) {
        console.log("Wake Lock エラー:", err);
      }
    }

    document.addEventListener("visibilitychange", async () => {
      if (wakeLock !== null && document.visibilityState === 'visible') {
        await requestWakeLock();
      }
    });

    // ==========================================
    // 2. 音声再生 (Web Audio API)
    // ==========================================
    let audioCtx = null;
    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function playBeep() {
      try {
        initAudio();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(2000, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.15);
      } catch (e) {
        console.error("Audio Error:", e);
      }
    }

    // ==========================================
    // 3. 全画面表示トリガー
    // ==========================================
    function requestFullScreen() {
      const doc = document.documentElement;
      if (doc.requestFullscreen) {
        doc.requestFullscreen().catch(() => {});
      } else if (doc.webkitRequestFullscreen) {
        doc.webkitRequestFullscreen();
      }
    }

    // 初回タップ状態のフラグ
    let isInitialized = false;

    // ==========================================
    // 4. 爆速・全画面緑色 認証処理
    // ==========================================
    let isProcessing = false;

    function onScanSuccess(decodedText, decodedResult) {
      if (isProcessing) return;
      isProcessing = true;

      playBeep();

      const container = document.getElementById("app-container");
      const statusText = document.getElementById("status-text");
      
      container.classList.add("success");
      statusText.innerText = "OK";

      fetch(`${GAS_URL}?id=${encodeURIComponent(decodedText)}`, {
        method: "POST",
        mode: "no-cors"
      }).catch(err => console.error("送信エラー:", err));

      setTimeout(() => {
        container.classList.remove("success");
        statusText.innerText = "QRをかざしてください";
        isProcessing = false;
      }, 1500);
    }

    // カメラ起動設定
    const html5QrcodeScanner = new Html5QrcodeScanner(
      "reader", 
      { 
        fps: 15, 
        qrbox: function(viewfinderWidth, viewfinderHeight) {
          const minEdge = Math.min(viewfinderWidth, viewfinderHeight);
          return { width: Math.floor(minEdge * 0.85), height: Math.floor(minEdge * 0.85) };
        }
      },
      false
    );
    html5QrcodeScanner.render(onScanSuccess);

    // ==========================================
    // 5. 画面タップ時の処理（初回:有効化 / 2回目以降:リロード）
    // ==========================================
    document.body.addEventListener("click", () => {
      if (!isInitialized) {
        // 初回タップ時：音・全画面・スリープ防止を起動
        initAudio();
        requestFullScreen();
        requestWakeLock();
        document.getElementById("hint-text").innerText = "※固まった場合は画面をタップすると再読み込みします";
        isInitialized = true;
      } else {
        // 2回目以降のタップ時：ページ全体をリロード
        location.reload();
      }
    });
  </script>
</body>
</html>
