<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>マナビバ 入退室打刻</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      width: 100vw;
      height: 100vh;
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Kaku Gothic ProN", sans-serif;
      background-color: #000;
      user-select: none;
    }

    /* 全体コンテナ */
    #app-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #000;
    }

    /* カメラ映像領域（全画面・軽量化プロパティ付き） */
    #reader-wrapper {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
      will-change: transform;
    }
    #reader {
      width: 100% !important;
      height: 100% !important;
      border: none !important;
    }
    #reader video {
      width: 100% !important;
      height: 100% !important;
      object-fit: cover !important;
    }

    /* 上部タイトル（オーバーレイ） */
    h1 {
      position: absolute;
      top: 3vh;
      left: 0;
      width: 100%;
      z-index: 10;
      color: #ffffff;
      margin: 0;
      text-align: center;
      font-size: 4.5vh;
      font-weight: 900;
      letter-spacing: 2px;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.8), 0 0 20px rgba(0, 0, 0, 0.5);
      pointer-events: none;
    }

    /* 下部ステータス表示エリア（オーバーレイ） */
    #status-container {
      position: absolute;
      bottom: 4vh;
      left: 0;
      width: 100%;
      z-index: 10;
      text-align: center;
      padding: 0 2vw;
      pointer-events: none;
    }
    #status-text {
      font-size: 6.5vh;
      font-weight: 900;
      color: #00ffff;
      line-height: 1.1;
      word-break: break-all;
      text-shadow: 0 2px 12px rgba(0, 0, 0, 0.9), 0 0 20px rgba(0, 0, 0, 0.6);
    }
    .tap-hint {
      font-size: 2.2vh;
      color: #e0e0e0;
      margin-top: 1vh;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.9);
    }

    /* 認証成功時の全画面緑色スタイル */
    #app-container.success {
      background-color: #28a745 !important;
    }
    #app-container.success h1,
    #app-container.success .tap-hint,
    #app-container.success #reader-wrapper {
      display: none !important;
    }
    #app-container.success #status-container {
      position: absolute;
      top: 0;
      left: 0;
      height: 100vh;
      width: 100vw;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    #app-container.success #status-text {
      color: #ffffff !important;
      font-size: 35vh !important;
      font-weight: 900 !important;
      letter-spacing: 4px;
      text-shadow: 0 8px 24px rgba(0,0,0,0.3);
    }
  </style>
</head>
<body>

  <div id="app-container">
    <h1>学習塾マナビバ 入退室管理</h1>
    
    <div id="reader-wrapper">
      <div id="reader"></div>
    </div>

    <div id="status-container">
      <div id="status-text">QRをかざしてください</div>
      <div class="tap-hint" id="hint-text">※画面タップで全画面＆カメラ再起動</div>
    </div>
  </div>

  <script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbxs2i-UDDR_ddUW902Z-oHHS_X133LjccSXEDzLNN143Vxi3aunK2g60VbPwNb0SzWu/exec";

    // 1. スリープ防止
    let wakeLock = null;
    async function requestWakeLock() {
      try {
        if ('wakeLock' in navigator) {
          wakeLock = await navigator.wakeLock.request('screen');
        }
      } catch (err) {
        console.log("Wake Lock エラー:", err);
      }
    }

    document.addEventListener("visibilitychange", async () => {
      if (wakeLock !== null && document.visibilityState === 'visible') {
        await requestWakeLock();
      }
    });

    // 2. 音声再生 (Web Audio API)
    let audioCtx = null;
    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function playBeep() {
      try {
        initAudio();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(2000, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.15);
      } catch (e) {
        console.error("Audio Error:", e);
      }
    }

    // 3. 全画面表示トリガー
    function requestFullScreen() {
      const doc = document.documentElement;
      if (!document.fullscreenElement && !document.webkitFullscreenElement) {
        if (doc.requestFullscreen) {
          doc.requestFullscreen().catch(() => {});
        } else if (doc.webkitRequestFullscreen) {
          doc.webkitRequestFullscreen();
        }
      }
    }

    // 4. スキャン成功時の処理
    let isProcessing = false;

    function onScanSuccess(decodedText) {
      if (isProcessing) return;
      isProcessing = true;

      playBeep();

      const container = document.getElementById("app-container");
      const statusText = document.getElementById("status-text");
      
      container.classList.add("success");
      statusText.innerText = "OK";

      fetch(`${GAS_URL}?id=${encodeURIComponent(decodedText)}`, {
        method: "POST",
        mode: "no-cors"
      }).catch(err => console.error("送信エラー:", err));

      setTimeout(() => {
        container.classList.remove("success");
        statusText.innerText = "QRをかざしてください";
        isProcessing = false;
      }, 1500);
    }

    // 5. 前面（インカメラ）固定 ＆ カメラ起動処理
    let html5QrCode = null;

    async function startCamera() {
      try {
        if (!html5QrCode) {
          html5QrCode = new Html5Qrcode("reader");
        } else {
          if (html5QrCode.isScanning) {
            await html5QrCode.stop();
          }
        }

        // 解析fpsを10に抑えてタブレットの負荷を軽減
        const config = {
          fps: 10,
          qrbox: (viewfinderWidth, viewfinderHeight) => {
            const minEdge = Math.min(viewfinderWidth, viewfinderHeight);
            return { width: Math.floor(minEdge * 0.6), height: Math.floor(minEdge * 0.6) };
          }
        };

        // `{ facingMode: "user" }` で最初から前面カメラ（インカメラ）を強制指定
        await html5QrCode.start(
          { facingMode: "user" },
          config,
          onScanSuccess
        );
      } catch (err) {
        console.error("前面カメラ起動エラー:", err);
        // 万が一前面指定で拒否された場合はカメラ全体検索にフォールバック
        try {
          await html5QrCode.start(
            { facingMode: { exact: "user" } },
            { fps: 10 },
            onScanSuccess
          );
        } catch (e) {
          document.getElementById("status-text").innerText = "カメラを起動できません";
        }
      }
    }

    // 初回カメラ起動
    window.addEventListener("DOMContentLoaded", () => {
      startCamera();
    });

    // 6. 画面タップ時の処理（全画面化＋スリープ防止＋前面カメラ再起動）
    document.body.addEventListener("click", () => {
      initAudio();
      requestFullScreen();
      requestWakeLock();
      startCamera();
    });
  </script>
</body>
</html>
